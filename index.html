<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Crowdsourcing Study</title>
    <link rel="stylesheet" href="css/styles.css" />
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <div id="boot-status">Loading...</div>

    <main id="shell" hidden>
      <section id="instructions"></section>
      <section id="content"></section>
      <footer id="nav">
        <button id="quit-btn" type="button" hidden>Quit Study</button>
        <button id="continue-btn" type="button" hidden disabled>Continue</button>
      </footer>
      <div id="progress" hidden><div id="progress-fill"></div></div>
    </main>

    <div id="boot-error" hidden></div>
  </body>
</html>
