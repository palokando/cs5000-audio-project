<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Crowdsourcing Study</title>
    <style>
      #progress {
        height: 10px;
        width: 100%;
        background: #e5e5e5;
        border-radius: 5px;
        overflow: hidden;
        margin-top: 16px;
      }
      #progress-fill {
        height: 100%;
        width: 0%;
        background: #2e8b2e;
        transition: width 250ms ease-out;
      }
    </style>
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <div id="boot-status">Loading...</div>

    <main id="shell" hidden>
      <section id="instructions"></section>
      <section id="content"></section>
      <footer id="nav">
        <button id="quit-btn" type="button" hidden>Quit Study</button>
        <button id="continue-btn" type="button" hidden disabled>Continue</button>
      </footer>
      <div id="progress" hidden><div id="progress-fill"></div></div>
    </main>

    <div id="boot-error" hidden></div>
  </body>
</html>
